# a4.yaml - self-consumption maximisation (A4-IMP). See README.md for all params and defaults.
---
appModule: a4
type: python
containerName: a4                                   # has to be lowercase
cron: "10 */15 * * * *"                             # 6-field cron: every 15 minutes at second 10
logLevel: 4
params:
  apiEndpoint: "http://localhost:8080/api"
  clientId: "your-client-id"                        # API credential: client ID ...
  token: "your-client-secret"                       # ... and its secret (generated by the site owner)
  consumptionPrognosisIdentifier: "consumption_p"   # load forecast [W]
  productionPrognosisIdentifier: "production_p"     # PV forecast [W], negative = generation
  ess_max_P_dp_id: "ess_max_P"                      # ESS power limit datapoint [W] (or essPowerLimitW: 175000)
  ess_max_E_dp_id: "ess_max_E"                      # ESS capacity datapoint [Wh] (or essMaxCharge: 284000)
  essEffectiveCharge: "ess_charge"                  # total stored energy now [Wh]
  # essEffectiveEndCharge: "ess_end_charge"         # optional end target datapoint [Wh]; default = start energy
  ess_min_soc: 15                                   # SoC window [%]
  ess_max_soc: 90
  pccImportLimitW: 55000                            # PCC import limit [W] (soft)
  pccExportLimitW: -1000000                         # PCC export limit [W], negative (soft)
  essResultPowerPlanIdentifier: "ess_p_a4"          # receives the plan [W], positive = charging
  interval: 60                                      # time step [s]
  min_period: 21600                                 # minimum forecast horizon [s]
  # essChargeEfficiency: 0.95
  # essDischargeEfficiency: 0.95
  # essLossWeight: 2.0
  # essDegradationWeight: 0.000001
