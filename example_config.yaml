# a4.yaml - self-consumption maximisation (A4-IMP). See README.md for all params and defaults.
---
appModule: a4
type: python
containerName: a4                                   # has to be lowercase
cron: "10 */15 * * * *"                             # 6-field cron: every 15 minutes at second 10
logLevel: 4
params:
  apiEndpoint: "http://localhost:8080/api"
  clientId: "your-client-id"                        # API credential: client ID ...
  token: "your-client-secret"                       # ... and its secret (generated by the site owner)
  consumptionPrognosisIdentifier: "consumption_p"   # load forecast [W]
  productionPrognosisIdentifier: "production_p"     # PV forecast [W], negative = generation
  # Operational parameters: a datapoint identifier (string, latest value read at every run) or a number (constant).
  ess_max_P_charge_dp_id: "ess_max_P_charge"        # ESS charge power limit [W], positive (or a number, e.g. 50000)
  ess_max_P_discharge_dp_id: "ess_max_P_discharge"  # ESS discharge power limit [W], positive (or a number)
  ess_max_E_dp_id: "ess_max_E"                      # USABLE ESS capacity [Wh] (or a number, e.g. 227500); the SoC limits are embedded in it
  pccImportLimitW: 55000                            # net PCC power upper limit [W], import positive (soft)
  pccExportLimitW: -1000000                         # net PCC power lower limit [W], signed (soft): negative = export
                                                    # allowed, 0 = no export, positive = minimum import
  essEffectiveCharge: "ess_charge"                  # usable energy now [Wh], 0 .. capacity (clamped with a WARNING)
  # essEffectiveEndCharge: "ess_end_charge"         # optional end target datapoint, usable energy [Wh], 0 .. capacity; default = start energy
  essResultPowerPlanIdentifier: "ess_p_a4"          # receives the plan [W], positive = charging
  interval: 60                                      # time step [s]
  min_period: 21600                                 # minimum forecast horizon [s]
  # essChargeEfficiency: 0.95
  # essDischargeEfficiency: 0.95
  # essLossWeight: 2.0
  # essDegradationWeight: 0.000001
  # essRampWeight: 0.001                            # anti-flicker: per kW of ESS power change between steps
